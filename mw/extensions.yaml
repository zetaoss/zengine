# Extra MediaWiki extensions: the ones not bundled with MediaWiki, installed into the image.
# Single source for what is installed and loaded. Not here:
#   - bundled extensions (Cite, VisualEditor, ...): nothing to install; the deployment's MediaWiki
#     settings load them
#   - extension configuration ($wg...): provided by the deployment (see docs/config.md), so the
#     packages and their settings stay loosely coupled
#
# hack/extensions.mjs reads this file to
#   - install: clone every entry that has repo/tag (image "extensions" stage)
#   - settings: generate ExtraExtensionSettings.php (wfLoadExtension, in list order)
# An extension in the list is installed and loaded. To turn one off, comment it out.
#
# Fields
#   name     extension directory name; also what wfLoadExtension() receives
#   repo/tag git source. tag is a git tag, a MediaWiki REL branch for gerrit extensions
#            (e.g. REL1_43; follows backports), or a full commit SHA for repositories without tags
#   local    true: provided by this repository (mwz/extensions/<name>), not cloned
#   load     list of names for wfLoadExtensions() when sub-modules are needed (default: [name])
# Every entry has either repo/tag or local.
# Local overrides in mwz/extensions/<name> are copied over a clone (e.g. MsUpload).

- name: AWS
  repo: https://github.com/edwardspec/mediawiki-aws-s3.git
  tag: v0.14.0
- name: CharInsert
  repo: https://gerrit.wikimedia.org/r/mediawiki/extensions/CharInsert.git
  tag: REL1_43
- name: CrawlerProtection
  repo: https://github.com/mywikis/CrawlerProtection.git
  tag: d033cdbac069db70f825be2f6f731930b7f18de7
- name: EmbedVideo
  repo: https://github.com/StarCitizenWiki/mediawiki-extensions-EmbedVideo.git
  tag: v4.1.0
- name: MailAPI
  repo: https://github.com/mailapi/mediawiki-extensions-MailAPI.git
  tag: v0.1.1
- name: MsUpload
  repo: https://gerrit.wikimedia.org/r/mediawiki/extensions/MsUpload.git
  tag: REL1_43
- name: Score
  repo: https://gerrit.wikimedia.org/r/mediawiki/extensions/Score.git
  tag: REL1_43
- name: SimpleMaps
  repo: https://github.com/jmnote/SimpleMaps.git
  tag: v0.2.2
- name: SimpleMarkdown
  repo: https://github.com/jmnote/SimpleMarkdown.git
  tag: v0.1.1
- name: SimpleMathJax
  repo: https://github.com/jmnote/SimpleMathJax.git
  tag: v0.9.0
- name: SimpleMermaid
  repo: https://github.com/jmnote/SimpleMermaid.git
