# pull-request.yml
name: pull-request
on:
  pull_request:
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check VERSION
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # Changes that go into the image must bump VERSION, so merging them releases them.
          # Docs, Markdown and CI settings do not.
          image_changes=$(git diff --name-only "$BASE"...HEAD | grep -vE '^(docs/|\.github/)|\.md$|^VERSION$' || true)
          if git diff --quiet "$BASE"...HEAD -- VERSION; then
            [ -z "$image_changes" ] && exit 0
            echo "error: this PR changes files that go into the image; bump VERSION ($(cat VERSION 2>/dev/null || echo missing)) in the same PR:" >&2
            echo "$image_changes" | head -20 >&2
            exit 1
          fi
          version=$(cat VERSION)
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]] || { echo "error: VERSION $version is not 0.x.y" >&2; exit 1; }
          # Newer than main's VERSION and every v0.x.y tag on main.
          latest=$( (git tag -l 'v*' --merged "$BASE" | grep -E '^v0\.[0-9]+\.[0-9]+$' | sed 's/^v//'; git show "$BASE:VERSION" 2>/dev/null) | sort -V | tail -1)
          if [ -n "$latest" ] && { [ "$version" = "$latest" ] || [ "$(printf '%s\n' "$latest" "$version" | sort -V | tail -1)" != "$version" ]; }; then
            echo "error: VERSION $version is not after $latest (latest tag or $BASE VERSION)" >&2; exit 1
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: goapp/go.sum
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none
      - name: Cache golangci-lint
        uses: actions/cache@v4
        with:
          path: |
            goapp/bin
            ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-v2.12.2-${{ hashFiles('goapp/go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-v2.12.2-
      - name: Cache checks result (.checks)
        uses: actions/cache@v4
        with:
          path: .checks
          key: ${{ runner.os }}-checks-${{ hashFiles('**/pnpm-lock.yaml', 'goapp/go.sum', 'mwz/extensions.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-checks-${{ hashFiles('**/pnpm-lock.yaml', 'goapp/go.sum', 'mwz/extensions.lock') }}-
            ${{ runner.os }}-checks-
      - run: make checks

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=pr
      - name: Generate version.json
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" node -e "const fs = require('node:fs'); fs.writeFileSync('svelte/src/shared/version.json', JSON.stringify({ gitVersion: process.env.APP_VERSION, gitCommit: process.env.GIT_COMMIT, buildDate: process.env.BUILD_DATE }, null, 2) + '\n')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          push: false
          context: .
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
