# release.yml
# A merge that changes VERSION releases v<VERSION>: it builds and pushes the image, then creates the tag and
# the GitHub release. Rerun failed jobs to retry a release.
name: release
on:
  push:
    branches: [main]
    paths: [VERSION]
jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read VERSION
        id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
      - name: Generate version.json
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" node -e "const fs = require('node:fs'); fs.writeFileSync('svelte/src/shared/version.json', JSON.stringify({ gitVersion: process.env.APP_VERSION, gitCommit: process.env.GIT_COMMIT, buildDate: process.env.BUILD_DATE }, null, 2) + '\n')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: docker-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.docker-push.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
