# release.yml
name: release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
  packages: write

jobs:
  docker-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
      - name: Generate version.json
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" node -e "const fs = require('node:fs'); fs.writeFileSync('svelte/src/shared/version.json', JSON.stringify({ gitVersion: process.env.APP_VERSION, gitCommit: process.env.GIT_COMMIT, buildDate: process.env.BUILD_DATE }, null, 2) + '\n')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
