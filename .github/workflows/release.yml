# release.yml
# A main commit that changes VERSION releases v<VERSION>: it builds and pushes the image, then creates the
# tag and the GitHub release. PRs bump VERSION (pull-request.yml checks it). Rerun failed jobs to retry.
name: release
on:
  push:
    branches: [main]
    paths: [VERSION]
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read and check VERSION
        id: version
        run: |
          version=$(cat VERSION)
          tag="v$version"
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]] || { echo "error: VERSION $version is not 0.x.y" >&2; exit 1; }
          # An existing tag is only allowed on this commit (a rerun); never overwrite another release's image.
          if existing=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            [ "$existing" = "$GITHUB_SHA" ] || { echo "error: $tag already exists on $existing" >&2; exit 1; }
          fi
          # The version must be newer than every other release: v0.x.y tags merged into the current main tip
          # (fetched fresh, so rerunning an old failed release sees releases made since), ignoring stray tags
          # on other branches or in other formats.
          latest=$(git tag -l 'v*' --merged origin/main | grep -E '^v0\.[0-9]+\.[0-9]+$' | grep -vxF "$tag" | sort -V | tail -1)
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            echo "error: $tag is not after the latest release tag $latest" >&2; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.tag }}
      - name: Generate version.json
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" node -e "const fs = require('node:fs'); fs.writeFileSync('svelte/src/shared/version.json', JSON.stringify({ gitVersion: process.env.APP_VERSION, gitCommit: process.env.GIT_COMMIT, buildDate: process.env.BUILD_DATE }, null, 2) + '\n')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Dockerfile.patch
        run: make dockerfile-patch
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.patch
          push: true
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: docker-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.docker-push.outputs.tag }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
