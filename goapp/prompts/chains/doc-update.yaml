# Rewrites an existing page's wikitext for AI edit. It runs the user's prompt as rendered from an AI edit prompt
# template (aiedit_prompts), so its single step passes it through.
name: doc-update
metadata:
  version: v1.0
  description: 기존 문서의 위키텍스트를 고쳐 쓴다.
spec:
  inputs: [prompt]
  steps:
    - name: generate
      description: AI 편집 프롬프트(편집)로 기존 문서의 위키텍스트를 고쳐 쓴다.
      inputs: [prompt]
      messages:
        - role: user
          content: "{prompt}"
      parser: text
      output: wikitext
