# Writes a new page's wikitext for AI edit. It runs the user's prompt as rendered from an AI edit prompt template
# (aiedit_prompts), so its single step passes it through.
name: doc-create
metadata:
  version: v1
  description: 새 문서의 위키텍스트를 작성한다.
spec:
  inputs: [prompt]
  steps:
    - name: generate
      description: AI 편집 프롬프트(생성)로 새 문서의 위키텍스트를 쓴다.
      inputs: [prompt]
      messages:
        - role: user
          content: "{prompt}"
      parser: text
      output: wikitext
